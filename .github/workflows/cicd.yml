name: CI/CD LyricsScraperApi

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]

env:
  IMAGE_NAME: skuill/lyrics-scraper-api

jobs:
  lyrics_scraper_api-cicd:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore src/LyricsScraperApi.sln
    - name: Lint
      run: dotnet format src/LyricsScraperApi.sln --verify-no-changes --no-restore
    - name: Build
      run: dotnet build src/LyricsScraperApi.sln --no-restore --configuration Release --verbosity minimal
    - name: Test (Unit) with Coverage
      run: |
        dotnet test src/LyricsScraperApi.UnitTests \
          --configuration Release \
          --no-build \
          --results-directory ./TestResults/Unit \
          -- \
          --coverage --coverage-output-format cobertura
    - name: Test (Integration) with Coverage
      run: |
        dotnet test src/LyricsScraperApi.IntegrationTests \
          --configuration Release \
          --no-build \
          --results-directory ./TestResults/Integration \
          -- \
          --coverage --coverage-output-format cobertura
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./TestResults/**/*.cobertura.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

  # Builds the image on every push and pull request (the Dockerfile is checked before a release);
  # pushes it to Docker Hub only for a published GitHub release.
  docker:
    needs: lyrics_scraper_api-cicd
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Release 2.1.3 gets the tags 2.1.3, 2.1, 2 and latest (latest only for a release without a suffix like -beta).
    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
        labels: |
          org.opencontainers.image.title=LyricsScraperApi
          org.opencontainers.image.description=REST API to search song lyrics across several lyrics sites, built on LyricsScraperNET.

    - name: Log in to Docker Hub
      if: github.event_name == 'release'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: src
        file: src/LyricsScraperApi/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name == 'release' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=${{ github.event_name == 'release' && steps.meta.outputs.version || '0.0.0-dev' }}
        # SBOM and build provenance attached to the image: Docker Scout and other scanners read them.
        sbom: true
        provenance: mode=max
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # The "Overview" on Docker Hub is README.md; its relative links become links to the files of the release tag.
    # DOCKERHUB_TOKEN needs the scope Read, Write, Delete for this step (Read & Write is enough only for the push).
    - name: Update Docker Hub description
      if: github.event_name == 'release'
      uses: peter-evans/dockerhub-description@v5
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        repository: ${{ env.IMAGE_NAME }}
        short-description: REST API to search song lyrics across several lyrics sites, built on LyricsScraperNET.
        enable-url-completion: true
