name: CI/CD LyricsScraperApi

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]

jobs:
  lyrics_scraper_api-cicd:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore src/LyricsScraperApi.sln
    - name: Build
      run: dotnet build src/LyricsScraperApi.sln --no-restore --configuration Release --verbosity minimal
    - name: Test (Unit) with Coverage
      run: |
        dotnet test src/LyricsScraperApi.UnitTests/LyricsScraperApi.UnitTests.csproj \
          --configuration Release \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults/Unit
    - name: Test (Integration) with Coverage
      run: |
        dotnet test src/LyricsScraperApi.IntegrationTests/LyricsScraperApi.IntegrationTests.csproj \
          --configuration Release \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults/Integration
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: |
          ./TestResults/Unit/**/coverage.cobertura.xml
          ./TestResults/Integration/**/coverage.cobertura.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

  publish_docker:
    needs: lyrics_scraper_api-cicd
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # runs only when release with a new tag
    steps:
    - uses: actions/checkout@v4
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract release version
      id: get_version
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

    - name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/lyrics-scraper-api:${{ env.RELEASE_VERSION }} -f src/LyricsScraperApi/Dockerfile src
        docker tag ${{ secrets.DOCKERHUB_USERNAME }}/lyrics-scraper-api:${{ env.RELEASE_VERSION }} ${{ secrets.DOCKERHUB_USERNAME }}/lyrics-scraper-api:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/lyrics-scraper-api:${{ env.RELEASE_VERSION }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/lyrics-scraper-api:latest
